<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | TrackMove</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="auth-page">

        <div class="auth-box">

            <div class="auth-logo">
                TM
            </div>

            <h1>TrackMove</h1>

            <h2>Welcome Back</h2>

            <p>
                Login to continue using TrackMove.
            </p>


            {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

            {% endif %}


            <form method="POST">

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required>

                <button type="submit">
                    Login
                </button>

            </form>


            <p class="account-link">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </p>


            <a href="/" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
