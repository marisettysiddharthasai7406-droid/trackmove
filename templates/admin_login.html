<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrackMove Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eaf7ff, #f5fbff, #eafaf7);
        }

        .login-box {
            width: 390px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #1769aa;
            margin-bottom: 8px;
        }

        .title {
            text-align: center;
            font-size: 22px;
            color: #172033;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #172033;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d7e1ea;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #1769aa;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #12588f;
        }

        .error {
            background: #fff0f0;
            color: #c62828;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #1769aa;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">TrackMove</div>

    <div class="title">Admin Login</div>

    <div class="subtitle">
        Authorized administrators only
    </div>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Admin Username</label>
        <input
            type="text"
            name="username"
            placeholder="Enter admin username"
            required
        >

        <label>Admin Password</label>
        <input
            type="password"
            name="password"
            placeholder="Enter admin password"
            required
        >

        <button type="submit">
            Login as Admin
        </button>

    </form>

    <div class="back">
        <a href="/login">← Back to User Login</a>
    </div>

</div>

</body>
</html>
